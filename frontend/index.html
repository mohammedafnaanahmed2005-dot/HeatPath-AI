<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeatPath AI — Urban Heat Decision Intelligence Platform</title>
    <meta name="description" content="AI-Powered Personalized Urban Heat Safety, Cooling Path & Worker Safety Platform using FortyGuard Intelligence" />
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root">
      <!-- Fallback shown before React mounts. If the JS bundle fails to load
           or parse in production, this stays visible instead of a blank screen. -->
      <div id="app-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e2e8f0;font-family:'Inter',system-ui,-apple-system,sans-serif">
        <div style="text-align:center;max-width:420px;padding:24px">
          <div style="font-size:2.5rem;margin-bottom:12px" aria-hidden="true">🔥</div>
          <div style="font-size:1.05rem;font-weight:700;color:#f8fafc;margin-bottom:6px">HeatPath AI</div>
          <div id="app-boot-msg" style="font-size:0.85rem;color:#94a3b8;line-height:1.6">Loading urban thermal intelligence…</div>
          <noscript>
            <div style="margin-top:12px;font-size:0.85rem;color:#f97316">JavaScript is required to run HeatPath AI. Please enable it and reload.</div>
          </noscript>
        </div>
      </div>
    </div>
    <script>
      // If React hasn't replaced the boot screen within 12s, the bundle likely
      // failed to load/execute (production chunk error). Show a recovery message.
      window.__APP_BOOT_TIMER__ = setTimeout(function () {
        var msg = document.getElementById('app-boot-msg');
        if (msg) {
          msg.innerHTML =
            'The app is taking longer than expected to load. This can happen if a script failed to load.<br/><br/>' +
            '<a href="" onclick="location.reload();return false;" style="color:#f97316;font-weight:700;text-decoration:none">Tap to reload</a>';
        }
      }, 12000);
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
